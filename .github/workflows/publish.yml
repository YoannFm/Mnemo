name: Publish version

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -- Adapte cette section a ton projet --

      # Exemple pour un projet Maven (plugin Minecraft)
      # - name: Build
      #   run: mvn package -DskipTests
      # - name: Set artifact path
      #   run: echo "ARTIFACT=target/mon-plugin.jar" >> $GITHUB_ENV

      # Exemple pour un projet Node.js
      # - name: Setup Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      # - name: Install & build
      #   run: npm ci && npm run build
      # - name: Zip artifact
      #   run: zip -r dist.zip dist/
      # - name: Set artifact path
      #   run: echo "ARTIFACT=dist.zip" >> $GITHUB_ENV

      # -- Fin de la section a adapter --

      - name: Extraire le numero de version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Publier sur NovaWebLicence
        env:
          NOVA_VERSION: ${{ steps.version.outputs.VERSION }}
          NOVA_ARTIFACT: ${{ env.ARTIFACT }}
        run: |
          curl -f -X POST "${{ secrets.NOVA_URL }}/api/deploy/publish" \
            -H "Authorization: Bearer ${{ secrets.NOVA_DEPLOY_TOKEN }}" \
            -F "product=${{ secrets.NOVA_PRODUCT_SLUG }}" \
            -F "version=${NOVA_VERSION}" \
            -F "changelog=Release v${NOVA_VERSION}" \
            -F "publish=1" \
            -F "file=@${NOVA_ARTIFACT}"
